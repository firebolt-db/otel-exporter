# ================================================ #
# Build and publish docker image with provided tag #
# ================================================ #

# Builds and published docker image tagged with provided tag.
name: dockerbuild
description: Build and push docker image
inputs:
  version:
    required: true
    description: A version to tag the docker image with
  arch:
    required: true
    description: Target architecture to build for (amd64 or arm64)
  gh_token:
    required: true
    description: Github token

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      id: validate_inputs
      shell: bash
      env:
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        case "$INPUT_ARCH" in
          amd64|arm64) ;;
          *)
            echo "Unsupported arch: $INPUT_ARCH" >&2
            exit 1
            ;;
        esac

        if [[ ! "$INPUT_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Invalid version: $INPUT_VERSION" >&2
          exit 1
        fi

        echo "arch=$INPUT_ARCH" >> "$GITHUB_OUTPUT"
        echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod

    - name: Build
      shell: bash
      env:
        ARCH: ${{ steps.validate_inputs.outputs.arch }}
        VERSION: ${{ steps.validate_inputs.outputs.version }}
      run: |
        CGO_ENABLED=0 \
        GOOS=linux \
        GOARCH="$ARCH" \
        go build \
          -trimpath \
          -buildmode=pie \
          --ldflags="-s -w -X github.com/firebolt-db/otel-exporter/internal/collector.Version=$VERSION" \
          -o ./otel-exporter .

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.gh_token }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        platforms: linux/${{ steps.validate_inputs.outputs.arch }}
        push: true
        tags: |
          ghcr.io/firebolt-db/otel-exporter:${{ steps.validate_inputs.outputs.version }}-${{ steps.validate_inputs.outputs.arch }}
