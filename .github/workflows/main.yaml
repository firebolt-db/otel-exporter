# ======================== #
# "main" branch automation #
# ======================== #

name: main
on:

  # This workflow is executed on every push to the "main" branch.
  push:
    branches:
      - main

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.genver.outputs.semver }}
      semver-oci: ${{ steps.genver.outputs.semver-oci }}
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate version
        uses: ./.github/actions/genver
        id: genver
        with:
          sha: ${{ github.sha }}

  container-image:
    runs-on: ubuntu-latest
    needs:
      - version
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build docker
        uses: ./.github/actions/dockerbuild
        with:
          version: ${{ needs.version.outputs.semver-oci }}
          arch: ${{ matrix.arch }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  container-image-manifest:
    runs-on: ubuntu-latest
    needs:
      - version
      - container-image
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.version.outputs.semver-oci }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image version: $VERSION" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "ghcr.io/firebolt-db/otel-exporter:$VERSION" \
            "ghcr.io/firebolt-db/otel-exporter:$VERSION-amd64" \
            "ghcr.io/firebolt-db/otel-exporter:$VERSION-arm64"

