# ================== #
# Release automation #
# ================== #

# Workflow that contains automation jobs that should run when a new release is created.

name: release
on:
  release:
    types:
      - released

jobs:
  container-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Build docker
        uses: ./.github/actions/dockerbuild
        with:
          version: ${{ github.event.release.tag_name }}
          arch: ${{ matrix.arch }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  container-image-manifest:
    runs-on: ubuntu-latest
    needs:
      - container-image
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "ghcr.io/firebolt-db/otel-exporter:$VERSION" \
            "ghcr.io/firebolt-db/otel-exporter:$VERSION-amd64" \
            "ghcr.io/firebolt-db/otel-exporter:$VERSION-arm64"
